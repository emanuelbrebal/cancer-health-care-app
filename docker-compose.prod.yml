services:
  database:
    image: postgres:15-alpine
    container_name: oncomente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env da raiz}
      POSTGRES_DB: ${POSTGRES_DB:-oncomente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: oncomente-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oncomente}
      NODE_ENV: production
      PORT: 3000
      # Segredos obrigatórios: o compose não sobe sem eles (e o backend recusa valores fracos).
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env da raiz}
      PSEUDONYM_KEY: ${PSEUDONYM_KEY:?Defina PSEUDONYM_KEY no .env da raiz}
      # Vazio = nenhuma origem web liberada (o app nativo não depende de CORS).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      CONSENT_TERM_VERSION: ${CONSENT_TERM_VERSION:-1.0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
