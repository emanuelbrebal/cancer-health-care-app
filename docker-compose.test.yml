# Postgres descartável para os testes e2e do backend (porta 5433, dados em memória).
# Uso: docker compose -f docker-compose.test.yml up -d && cd apps/backend && npm run test:e2e
services:
  database-test:
    image: postgres:15-alpine
    container_name: oncomente-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oncomente_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oncomente_test"]
      interval: 2s
      timeout: 3s
      retries: 15
